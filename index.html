<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema Horario · v5.1.0</title>
</head>
<body>
  <div class="operational-grid" id="operationalGrid" aria-hidden="true" hidden></div>
  <div class="container" style="display:none">
    <h2 class="sr-only">Editor horario v5.1</h2>
    <div class="header">
      <div class="title-block">
        <div class="title">// SISTEMA.HORARIO</div>
        <div class="subtitle" id="subtitleTxt">tienda · N personas · v5.1.0</div>
        <div class="status-rail" id="statusRail" role="status" aria-live="polite" aria-atomic="true"></div>
      </div>
      <div class="nav">
        <button id="bLogin" class="nav-btn" style="border-color:transparent">Admin</button>
        <input type="date" id="datePicker" class="nav-btn" style="padding:2px 4px; height: 21px; font-family: inherit;"/>
        <button class="nav-btn" id="bPrev">← ant</button>
        <span class="week-tag" id="wLabel">...</span>
        <button class="nav-btn" id="bNext">sig →</button>
      </div>
    </div>
    <div class="dashboard">
      <div>
        <div class="tabs">
          <button class="tab active" data-view="person">Por persona</button>
          <button class="tab" data-view="day">Por día</button>
          <button class="tab" data-view="cover">Cobertura</button>
          <button class="tab" data-view="hours">Horas</button>
        </div>
        <div class="grid-wrap" id="tContainer"></div>
        <div class="legend-block" id="legendBlock"></div>
      </div>
      <div class="metrics-side" id="metricsSide"></div>
    </div>
    <div class="actions">
      <button class="action-btn" id="bEditEmps">👥 Empleados</button>
      <button class="action-btn" id="bEditShifts">✎ Turnos base</button>
      <button class="action-btn" id="bCreateWeek" hidden>Crear semana</button>
      <button class="action-btn" id="bReset">↻ Restablecer</button>
      <button class="action-btn primary" id="bLock">✓ Confirmar</button>
    </div>
    <div class="log-panel" id="logPanel">
      <!-- initial empty, renderLog fills this -->
    </div>
      <div class="modal-bg" id="modalBg">
        <div class="modal" id="modalBox">
          <div class="modal-title" id="modalTitle">Seleccionar turno</div>
          <div id="modalBody"></div>
          <button class="modal-close" id="modalClose">Cerrar</button>
        </div>
      </div>
    </div>

  <!-- Keep the login gate outside the authenticated application container. -->
  <main class="login-gate" id="loginBg" aria-labelledby="loginTitle">
    <section class="login-shell">
      <header class="login-brand">
        <p class="login-identity">// SISTEMA.HORARIO</p>
        <p class="login-context">Planificación operativa · acceso al equipo</p>
      </header>
      <div class="login-panel">
        <p class="login-eyebrow">ACCESO / 01</p>
        <h1 id="loginTitle">Tu semana,<br>en orden.</h1>
        <p class="login-intro">Inicia sesión para consultar el horario de tu equipo.</p>
        <form id="loginForm" class="login-form" aria-busy="false">
          <div class="login-field">
            <label for="loginEmail">Correo electrónico</label>
            <input type="email" id="loginEmail" name="email" autocomplete="username" placeholder="tu@correo.com" aria-describedby="loginError" required>
          </div>
          <div class="login-field">
            <label for="loginPwd">Contraseña</label>
            <div class="login-password">
              <input type="password" id="loginPwd" name="password" autocomplete="current-password" aria-describedby="loginError" required>
              <button id="loginPwdToggle" type="button" class="login-password-toggle" aria-label="Mostrar contraseña" aria-pressed="false" aria-controls="loginPwd">
                <svg class="login-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true" focusable="false"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
                <svg class="login-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true" focusable="false"><path d="m3 3 18 18M10.6 5.1A12 12 0 0 1 12 5c6.5 0 10 7 10 7a18 18 0 0 1-3.2 4M6.3 6.3C3.5 8.5 2 12 2 12s3.5 7 10 7a12 12 0 0 0 5.7-1.7M10 10a3 3 0 0 0 4 4"/></svg>
              </button>
            </div>
          </div>
          <div id="loginError" class="login-error" role="alert" aria-atomic="true"></div>
          <button id="bLoginSubmit" type="submit" class="login-submit">Entrar</button>
        </form>
      </div>
      <footer class="login-footer"><span>HORARIOS / EQUIPO / COBERTURA</span><span>v5.1.0</span></footer>
    </section>
  </main>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
